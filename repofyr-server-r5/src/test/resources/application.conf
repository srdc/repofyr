# Test overrides for the repofyr-server-r5 suite.
#
# Everything not set here comes from repofyr-reference.conf in repofyr-core, which this file
# layers over rather than replaces. Keep it to the keys the suite actually needs to differ on:
# a key repeated at its default value is a copy that silently rots when the default moves.

server {
  # A port of its own, so an R4 and an R5 suite can run at the same time.
  port = 8081
}

fhir {
  root-url = "http://127.0.0.1:8081/fhir"
  # Explicit rather than inherited. repofyr-reference.conf ships the whole auditing block
  # commented out, and an absent block and a block configured 'none' are distinct paths through
  # AuditManager. The suite exercises the configured one.
  auditing {
    repository = "none"
  }
}

mongodb {
  # The suite boots a real server against an embedded MongoDB on a port of its own, so parallel
  # module runs and a developer's local mongod do not collide.
  embedded = true
  host = "localhost:27020"
  db = onfhir-r5-test
}

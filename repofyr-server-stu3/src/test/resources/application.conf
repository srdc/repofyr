# Test configuration for the repofyr-server-stu3 suite.
#
# Ports are deliberately distinct from the other server modules so the three
# suites stay independent and can run without colliding: repofyr-server-r4 uses
# MongoDB 27019 / HTTP 8080, repofyr-server-r5 uses 27020 / 8081, and this
# module uses 27021 / 8082. The database name is distinct for the same reason -
# a leftover database from one module must not be visible to another.

# General server configurations
server {
  # Hostname that the server will work on. Using 0.0.0.0 will bind the server to both localhost and the IP of the server that you deploy it
  host = 0.0.0.0
  # Port that the server will listen
  port = 8082
  # Base Uri for the server e.g. With this default configuration, the root path of the FHIR server will be http://localhost:8082/fhir
  base-uri = fhir
  ssl {
    # Path to the java keystore for enabling ssl, use null to disable ssl
    keystore = null
    # Password of the keystore for enabling ssl
    password = null
  }
}
# FHIR related configurations
fhir {
  # When true, then for every restart of the server, it reads the FHIR configuration files, configure the server accordingly and then setup/update the database. This should be true if executed for the first time.
  # When false, then for every restart of the server, it configures the server by reading the existing configurations from the database.
  initialize = true
  # Root URL for Server Access (this can be different from server.properties due to deployment alternatives especially when you are deploying the server behind a proxy)
  root-url = "http://127.0.0.1:8082/fhir"
  # Root URL for FHIR Infrastructure Resource definitions (Conformance, StructureDefinition, etc), if null this will be same with root-url. This can be a canonical URL.
  definitions-url = null

  # Validation alternatives for FHIR resources to be created/updated
  # base => Validation against base HL7 FHIR resources and profiles
  # profile => Validation against all provided profiles
  # none => Disable resource validation
  validation = "profile"

  # Configuration files (as FHIR Foundational resources) for FHIR capabilities of the server, all paths should be absolute or relative to the location of application.conf file.
  initialization {
    # Path to definitions.zip that includes the base standart FHIR definitions, if null the default definitions-stu3.json.zip supplied by onfhir-definitions-stu3 is used.
    base-definitions-path = null

    # CapabilityStatement file path. Left null so the suite exercises the same
    # classpath lookup a default deployment performs - the very lookup that was
    # broken before 4.0.0 aligned the packaged resource names with what
    # FhirSTU3Configurator derives.
    conformance-path = null

    # Path to the zip file or folder that includes the FHIR resource and data type profile definitions (FHIR StructureDefinition) to be used in this instance
    profiles-path = null

    # Path to the zip file or folder that includes the extra FHIR search parameter definitions (FHIR SearchParameter) in addition to parameters defined by the base standart that you mention in CapabilityStatement
    parameters-path = null

    # Path to the zip file or folder that includes the FHIR compartment definitions (FHIR CompartmentDefinition) for compartment search. Only the compartments listed here and mentioned in CapabilityStatement will be supported.
    compartments-path = null

    # Path to the zip file or folder that includes the FHIR Value Set definitions (FHIR ValueSet) that are referenced by your FHIR profiles. (Used in validations)
    valuesets-path = null

    # Path to the zip file or folder that includes the FHIR Code system definitions (FHIR CodeSystem) that are referenced by your FHIR value sets (Not used currently, to be used later for validation)
    codesystems-path = null

    # Path to the zip file or folder that includes the definitions of FHIR Operations  (FHIR OperationDefinition) that you want to support by this instance
    operations-path = null

    # Path to the database index configuration file (JSON format) indicating the database indexes and shard keys for each resource types supported. If not given, default file given under the specific FHIR version module (for example repofyr-server-stu3/db-index-conf-stu3.json) will be used.
    index-conf-path = null
  }

  # Default settings while configuring FHIR capabilities
  default {
    # Default preference to return in HTTP responses. Can be either 'minimal' or 'representation'. See https://www.hl7.org/fhir/http.html#ops
    return-preference = representation
    # Default search mechanism handling when the client sends no 'Prefer: handling=' header.
    # See https://www.hl7.org/fhir/search.html
    # lenient => Ignores unknown/unsupported parameters and performs the search
    # strict  => Returns an error if unknown/unsupported parameters are used by the client
    search-handling = strict
    # Default page count (number of resource instances) when returning results from FHIR history and search interactions. See https://www.hl7.org/fhir/http.html#paging
    page-count = 20
    # Default value for CapabilityStatement.rest.resource.versioning when not present in CapabilityStatement for the resource type
    versioning = "versioned"
    # Default value for CapabilityStatement.rest.resource.readHistory when not present in CapabilityStatement for the resource type
    read-history = false
    # Default value for CapabilityStatement.rest.resource.updateCreate when not present in CapabilityStatement for the resource type
    update-create = true
    # Default value for CapabilityStatement.rest.resource.conditionalCreate when not present in CapabilityStatement for the resource type
    conditional-create = false
    # Default value for CapabilityStatement.rest.resource.conditionalUpdate when not present in CapabilityStatement for the resource type
    conditional-update = false
    # Default value for CapabilityStatement.rest.resource.conditionalDelete when not present in CapabilityStatement for the resource type
    conditional-delete = "not-supported"
  }

  # Authorization settings
  authorization {
    # No authorization in the smoke suite; the round trip under test is the FHIR
    # interaction path, not the authz path.
    method = "none"
    token-resolution = "introspection"
    authz-server-dynamic-registration = false
    resource-server-metadata-path = null
    resource-server-jwks-path = null
    authz-server-discovery = "none"
    token-caching-max-capacity = 1000
    token-caching-initial-capacity = 100
    token-caching-time-to-live = 30
    token-caching-time-to-idle = 10
  }

  # Configuration for auditing the FHIR interactions executed on this server
  auditing {
    repository = "none"
  }
}

# Configurations related with Akka.io platform (Do not change this unless you are a experienced user)
akka {
  stdout-loglevel = "OFF"
  loglevel = "OFF"
  actor {
    deployment {
      "/**" {
        dispatcher = "akka.actor.onfhir-blocking-dispatcher"
      }
    }
    onfhir-blocking-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 32
      }
      throughput = 1
    }
  }
}

# Configurations for Akka HTTP
akka.http {
  server {
    # Header for server
    server-header = OnFhir.io FHIR Repository
    parsing {
      uri-parsing-mode = relaxed
    }
    # Request timeout for all REST services (FHIR or non-FHIR)
    request-timeout = 60 s
    # Maximum inactivity time of a given HTTP connection
    idle-timeout = 60 s
    # Should be on in order to get IP address of the clients for audits
    remote-address-header = on
  }
}

# Configurations for Kafka integration
kafka {
  # Switch it to true if you want to send all created/deleted/updated FHIR resources to kafka as events
  enabled = false
  # Kafka broker hostname and port
  host = localhost
  port = 9092
  # Kafka topic for FHIR events
  topic = raw.fhir
  # Kafka client identifier
  client.id = onfhir
  enabled-resources = []
}

# MongoDB database configurations
mongodb {
  # The suite runs on an embedded MongoDB started by OnFhirSTU3Test.
  embedded = true

  # Distinct from repofyr-server-r4 (27019) and repofyr-server-r5 (27020).
  host = "localhost:27021"
  # Database name for FHIR resources
  db = onfhir-stu3-test

  # By enabling sharding, the server initiates the sharding in the specified collections based on the configuration
  sharding = false
  # Enable MongoDB transaction usage (only enable this if your MongoDB setup support it; if it is a replica set or sharded cluster)
  transaction = false

  # MongoDB connection pooling configurations
  pooling {
    #minimum number of connections in pool
    minSize = 5
    #maximum number of connections in pool
    maxSize = 200
    #The maximum time that a thread may wait for a connection to become available. (in seconds)
    maxWaitTime = 180
    #The maximum time (in seconds) a pooled connection can live for. A zero value indicates no limit to the life time.
    maxConnectionLifeTime = 1200
  }
}

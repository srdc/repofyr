# Sample Repofyr configuration for the Docker setup.
#
# This file only overrides what this sample changes. Every other key comes from
# repofyr-reference.conf inside the server jar, so upgrading Repofyr picks up new defaults here
# without this file having to be re-copied. Add a key only when you mean to differ from the
# default; the full set of keys and their documentation lives in repofyr-reference.conf.
#
# The container entrypoint maps environment variables onto JVM system properties, and those win
# over this file - so DB_HOST, FHIR_ROOT_URL and friends override anything set here.

fhir {
  initialization {
    # Absolute, because a relative path resolves against the working directory rather than against
    # this file - so it would break as soon as the server were started from anywhere else. This is
    # ONFHIR_HOME/conf, where docker-compose.yml mounts sample-setup/conf.
    conformance-path = "/usr/local/onfhir/conf/conformance-statement.json"
    profiles-path = "/usr/local/onfhir/conf/profiles"
    index-conf-path = "/usr/local/onfhir/conf/db-index-conf.json"
  }

  default {
    # Ignore unknown search parameters rather than rejecting the request, which is the friendlier
    # default while someone is exploring a sample server. Production deployments usually want the
    # shipped 'strict'.
    search-handling = lenient
  }

  # Switch auditing off explicitly. The default ships the whole block commented out, and an
  # absent block is a different path through AuditManager than one configured 'none'.
  auditing {
    repository = "none"
  }
}

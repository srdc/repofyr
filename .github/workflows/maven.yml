name: Maven verification

on:
  push:
    branches: [master, updating-operation-handling, repository-split]
  pull_request:
    branches: [master, updating-operation-handling, repository-split]

jobs:
  server-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Full Repofyr reactor
        run: mvn -B test

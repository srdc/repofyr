name: Maven verification

on:
  push:
    branches: [master, updating-operation-handling, repository-split]
  pull_request:
    branches: [master, updating-operation-handling, repository-split]

env:
  LIBRARY_MODULES: onfhir-common,onfhir-client,onfhir-path,onfhir-query,onfhir-config,onfhir-expression,onfhir-validation,onfhir-template-engine,onfhir-r4

jobs:
  library-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Gates A and B - source and resources
        shell: pwsh
        run: ./scripts/check-forbidden-imports.ps1
      - name: Gate C - resolved dependency graph
        run: mvn -B -pl "$LIBRARY_MODULES" -am validate -DskipTests
      - name: Dependency license allow-list
        shell: pwsh
        run: ./scripts/check-library-dependency-licenses.ps1

  binary-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Set up Coursier
        uses: coursier/setup-action@v1
      - name: MiMa against public 3.3 artifacts
        shell: pwsh
        run: ./scripts/check-binary-compatibility.ps1

  split-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build library-only then server-only reactors
        shell: pwsh
        run: ./scripts/rehearse-library-server-split.ps1

  full-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Full reactor tests
        run: mvn -B test
